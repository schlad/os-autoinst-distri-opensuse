name:           agama_irq_delivery_network_baremetal
description:    >
    Install bare metal with Agama, then check network card interrupt
    delivery on a system with more than eight online CPUs on at least two
    sockets (irq_delivery_network, poo#49517). Work in progress: the test
    does not generate traffic yet. Set IRQ_DELIVERY_DEVICE to one or more
    network interfaces of PCI network cards, separated by spaces.
vars:
    INST_AUTO: agama_auto/sle_default_ipmi.jsonnet
    DESKTOP: textmode
    LTP_BAREMETAL: '1'
schedule:
    - installation/ipxe_install
    - installation/agama_reboot
    - installation/grub_test
    - installation/first_boot
    - kernel/update_kernel
    - kernel/irq_delivery_network
