name:           agama_irq_multisocket_baremetal
description:    >
    Install bare metal with Agama, then check PCI storage interrupt delivery
    under direct I/O on a system with more than eight online CPUs on at
    least two sockets (irq_multisocket, poo#49517). Set
    IRQ_MULTISOCKET_DEVICE to a whole PCI storage disk of the machine,
    preferably under /dev/disk/by-id/. The test only reads the disk.
vars:
    INST_AUTO: agama_auto/sle_default_ipmi.jsonnet
    DESKTOP: textmode
    LTP_BAREMETAL: '1'
schedule:
    - installation/ipxe_install
    - installation/agama_reboot
    - installation/grub_test
    - installation/first_boot
    - kernel/update_kernel
    - kernel/irq_multisocket
